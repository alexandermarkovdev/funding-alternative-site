<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Four left-side stats options | Funding Alternative</title><link rel="stylesheet" href="brand-assets/tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7ead2;color:#404040;font:16px/1.4 var(--fa-font)}
.controls{padding:14px 24px;display:flex;gap:12px 26px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ccbea5}
.controls strong{font-size:18px;font-weight:600}.choices{display:flex;gap:5px;flex-wrap:wrap}
button,a{font:500 14px/1.2 var(--fa-font)}button{min-height:40px;padding:9px 13px;border:1px solid #b5a78e;border-radius:6px;background:transparent;color:#404040;cursor:pointer}
button:hover{background:#e8d8bc}button[aria-pressed=true]{background:#404040;border-color:#404040;color:#fff}
a{color:#404040;text-underline-offset:4px;margin-left:auto;white-space:nowrap}button:focus-visible,a:focus-visible{outline:3px solid #a4311d;outline-offset:3px}
iframe{display:block;border:0;width:100%;height:calc(100svh - var(--controls-height,80px));background:#282624}
.note{font-size:14px;margin:0;padding:12px 24px;background:#fffaf2}.note span{font-weight:600}
::selection{background:#a4311d;color:white}
@media(max-width:700px){.controls{padding:12px;gap:10px}.controls strong{width:100%}button{font-size:13px;padding:9px 10px}.choices{gap:4px}a{margin-left:0}.note{padding:12px}}
</style></head><body>
<header class="controls"><strong>Left-side stats</strong>
<div class="choices" role="group" aria-label="Product"><button data-product="bca" aria-pressed="true">BCA</button><button data-product="mca" aria-pressed="false">MCA</button><button data-product="sif" aria-pressed="false">SIF</button></div>
<div class="choices" role="group" aria-label="Stats layout"><button data-variant="1" aria-pressed="true">1 · Icon facts</button><button data-variant="2" aria-pressed="false">2 · Fact grid</button><button data-variant="3" aria-pressed="false">3 · Vertical list</button><button data-variant="4" aria-pressed="false">4 · Warm block</button></div>
<a id="standalone" target="_blank" rel="noopener" href="business-cash-advance-stats-preview.html?variant=1">Open full preview</a></header>
<iframe title="Business Cash Advance — Clean left hero preview" src="business-cash-advance-stats-preview.html?variant=1"></iframe>
<p class="note"><span id="description">Icon facts:</span> <span id="detail" style="font-weight:400">Four small icons with facts beneath the copy, above the buttons.</span> All four keep the clean-left hero and full-screen photograph. The facts stay on the left; no bottom bar. Current pages are unchanged.</p>
<script>
const products={bca:['business-cash-advance','Business Cash Advance'],mca:['merchant-cash-advance','Merchant Cash Advance'],sif:['selective-invoice-financing','Selective Invoice Financing']};
const options=[['Icon facts','Four small icons with facts beneath the copy, above the buttons.'],['Fact grid','A compact two-column arrangement with fine separators.'],['Vertical list','Four slim rows with icons, labels and right-aligned values.'],['Warm block','A compact beige fact block below the buttons, entirely on the left.']];
let product='bca',variant='1';const frame=document.querySelector('iframe'),controls=document.querySelector('.controls');
const params=new URLSearchParams(location.search);if(products[params.get('product')])product=params.get('product');if(/^[1-4]$/.test(params.get('variant')))variant=params.get('variant');
function update(){const src=products[product][0]+'-stats-preview.html?variant='+variant;frame.src=src;frame.title=products[product][1]+' — '+options[variant-1][0]+' hero preview';document.querySelector('#standalone').href=src;document.querySelectorAll('[data-product]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.product===product)));document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));document.querySelector('#description').textContent=options[variant-1][0]+':';document.querySelector('#detail').textContent=options[variant-1][1];history.replaceState(null,'','?product='+product+'&variant='+variant)}
controls.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.product)product=b.dataset.product;if(b.dataset.variant)variant=b.dataset.variant;update()});
new ResizeObserver(()=>document.documentElement.style.setProperty('--controls-height',controls.offsetHeight+'px')).observe(controls);update();
</script></body></html>
